<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Jess & Conner's Engagement Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Potta+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: white;
      font-family: 'Potta One', serif;
    }
    .page {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .frame {
      width: 100%;
      max-width: 768px;
    }
    .invite-svg {
      width: 100%;
      height: auto;
      display: block;
      filter: url(#texture);
    }
    .rsvp-link {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="frame">
      <svg viewBox="0 0 800 1000" class="invite-svg" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="800" height="1000" fill="white" />

        <!-- Outer border - thick frame -->
        <path
          d="M 20,20 L 780,20 L 780,980 L 20,980 Z M 50,50 L 50,950 L 750,950 L 750,50 Z"
          fill="#1e3a8a"
          style="filter: url(#roughen);"
        />

        <!-- Names -->
        <text x="400" y="180" text-anchor="middle"
          style="font-family: 'Potta One', serif; font-size: 90px; font-weight: 900; fill: #1e3a8a; filter: url(#roughen);">
          JESS &amp;
        </text>
        <text x="400" y="270" text-anchor="middle"
          style="font-family: 'Potta One', serif; font-size: 90px; font-weight: 900; fill: #1e3a8a; filter: url(#roughen);">
          CONNER'S
        </text>

        <!-- Engagement Party -->
        <text x="400" y="370" text-anchor="middle"
          style="font-family: 'Potta One', serif; font-size: 90px; font-weight: 900; fill: #1e3a8a; filter: url(#roughen);">
          ENGAGEMENT
        </text>
        <text x="400" y="460" text-anchor="middle"
          style="font-family: 'Potta One', serif; font-size: 90px; font-weight: 900; fill: #1e3a8a; filter: url(#roughen);">
          PARTY
        </text>

        <!-- Details -->
        <text x="400" y="680" text-anchor="middle"
          style="font-family: 'Potta One', serif; font-size: 52px; font-weight: 700; fill: #1e3a8a; filter: url(#roughen);">
          JUNE 13, 2026
        </text>

        <text x="400" y="750" text-anchor="middle"
          style="font-family: 'Potta One', serif; font-size: 52px; font-weight: 700; fill: #1e3a8a; filter: url(#roughen);">
          7PM
        </text>

        <text x="400" y="820" text-anchor="middle"
          style="font-family: 'Potta One', serif; font-size: 48px; font-weight: 700; fill: #1e3a8a; filter: url(#roughen);">
          N BARTON ST
        </text>

        <!-- RSVP button -->
        <a href="rsvp.html" class="rsvp-link">
          <g transform="translate(400, 900)">
            <rect x="-100" y="-30" width="200" height="60" fill="#1e3a8a"
              style="filter: url(#roughen); cursor: pointer;" />
            <text x="0" y="10" text-anchor="middle"
              style="font-family: 'Potta One', serif; font-size: 40px; font-weight: 700; fill: white; filter: url(#roughen); cursor: pointer;">
              RSVP
            </text>
          </g>
        </a>

        <!-- Filters -->
        <defs>
          <filter id="roughen">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
          </filter>
          <filter id="texture">
            <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="5" result="noise" />
            <feColorMatrix in="noise" type="matrix"
              values="0 0 0 0 0.95
                      0 0 0 0 0.95
                      0 0 0 0 0.95
                      0 0 0 1 0"
              result="whiteNoise" />
            <feBlend in="SourceGraphic" in2="whiteNoise" mode="multiply" />
          </filter>
        </defs>
      </svg>
    </div>
  </div>
</body>
</html>
